<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Prueba de Impresión — 80mm & RawBT</title>
<style>
  body{font-family:ui-sans-serif,system-ui,-apple-system,Roboto;margin:16px}
  button{padding:12px 14px;border:1px solid #ddd;border-radius:10px;background:#fff;margin-right:8px}
  #printArea{display:none}
  @media print{
    body *{visibility:hidden}
    #printArea, #printArea *{visibility:visible}
    #printArea{position:fixed; left:0; top:0}
    #printArea.ticket80{width:76mm !important; padding:2mm !important}
    @page{ size:80mm auto; margin:0 }
    #printArea.ticket80 .row{display:flex; justify-content:space-between; font-size:11px}
    #printArea.ticket80 .title{ text-align:center; font-weight:700; font-size:14px; margin-bottom:6px }
    #printArea.ticket80 .line{ border-top:1px dashed #000; margin:6px 0 }
    #printArea.ticket80 .mono{ font-family: ui-monospace, Menlo, "Courier New", monospace; font-size:11px }
  }
</style>
</head>
<body>
  <h2>Prueba de Impresión</h2>
  <p>Si estás viendo esto en <b>https://marcianoper.github.io/tickets/impresion.html</b>, ya puedes probar:</p>
  <div style="margin-bottom:12px">
    <button id="btnHtml">Imprimir HTML 80 mm</button>
    <button id="btnRawBT">Imprimir con RawBT (directo)</button>
  </div>
  <div id="printArea"></div>

<script>
const $ = s => document.querySelector(s);
function to2(n){ return Number(n||0).toFixed(2) }

function buildHtmlTicket(){
  const now = new Date();
  const fecha = now.toLocaleDateString();
  const hora  = now.toLocaleTimeString();
  const items = [
    {p:'Panza de res', kg: 2.35, pu: 98.00},
    {p:'Libro',        kg: 1.10, pu: 85.00},
    {p:'Pata blanca',  kg: 3.00, pu: 42.00},
  ];
  const lines = items.map(x=>{
    const imp = x.kg * x.pu;
    return `
      <div class="row"><div>${x.p}</div><div class="mono">$${to2(imp)}</div></div>
      <div class="mono">${to2(x.kg)}kg × $${to2(x.pu)}</div>
    `;
  }).join('');
  const total = items.reduce((a,b)=> a + b.kg*b.pu, 0);

  return `
    <div class="ticket80">
      <div class="title">Carnes y Vísceras del Centro</div>
      <div class="mono">Folio: TEST-HTML</div>
      <div class="mono">Fecha: ${fecha}  ${hora}</div>
      <div class="line"></div>
      ${lines}
      <div class="line"></div>
      <div class="row"><div><b>Total</b></div><div class="mono"><b>$${to2(total)}</b></div></div>
      <div class="mono">Saldo: $${to2(total)}</div>
      <div class="line"></div>
      <div class="mono"><b>Notas del cliente:</b> cortar pata en rodajas</div>
      <div style="text-align:center; margin-top:8px" class="mono">¡Gracias por su preferencia!</div>
    </div>`;
}
function printHtml80(){
  const el = $('#printArea');
  el.classList.add('ticket80');
  el.innerHTML = buildHtmlTicket();
  el.style.display = 'block';
  window.print();
  setTimeout(()=>{ el.style.display='none'; el.classList.remove('ticket80'); el.innerHTML=''; }, 400);
}

// ===== ESC/POS → RawBT (Android) =====
function esc(...b){ return Uint8Array.from(b); }
function text(s){ return new TextEncoder().encode(s); }
function cat(...arr){ const len = arr.reduce((a,b)=>a+b.length,0); const out = new Uint8Array(len); let o=0; for(const a of arr){ out.set(a,o); o+=a.length; } return out; }
function toB64(u8){ let bin=""; for(let i=0;i<u8.length;i++) bin += String.fromCharCode(u8[i]); return btoa(bin); }
function buildEscPos(){
  const INIT=esc(0x1B,0x40), CUT=esc(0x1D,0x56,0x00), B=esc(0x1B,0x45,0x01), b0=esc(0x1B,0x45,0x00);
  const L=esc(0x1B,0x61,0x00), C=esc(0x1B,0x61,0x01), LF=esc(0x0A);
  const items=[{p:'Panza de res',kg:2.35,pu:98},{p:'Libro',kg:1.1,pu:85},{p:'Pata blanca',kg:3,pu:42}];
  const total=items.reduce((a,b)=>a+b.kg*b.pu,0);
  let arr=[INIT,C,B,text('Carnes y Vísceras del Centro\n'),b0,L,text('--------------------------------\n')];
  for(const it of items){ arr.push(text(it.p+'\n')); arr.push(text(`${to2(it.kg)}kg x $${to2(it.pu)}  $${to2(it.kg*it.pu)}\n`)); }
  arr.push(text('--------------------------------\n'),B,text(`Total: $${to2(total)}\n`),b0,text('Notas: cortar pata en rodajas\n'),LF,LF,C,text('¡Gracias!\n'),LF,LF,LF,CUT);
  return cat(...arr);
}
function printWithRawBT(){
  const b64 = toB64(buildEscPos());
  const url = `rawbt://print?data=${encodeURIComponent(b64)}`;
  let w; try{ w = window.open(url,'_blank'); }catch(e){}
  setTimeout(()=>{ if(!w || w.closed) location.href = url; }, 200);
}

document.getElementById('btnHtml').addEventListener('click', printHtml80);
document.getElementById('btnRawBT').addEventListener('click', printWithRawBT);
</script>
</body>
</html>
