<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Comandas Cocina — Guadalupe Victoria</title>

  <style>
    :root{
      --bg:#f4ead9;
      --paper:#fbf4e8;
      --card:#fffaf2;
      --ink:#2f241c;
      --muted:#7a6554;
      --line:rgba(47,36,28,.14);
      --brand:#3b2a1f;
      --gold:#b9842a;
      --green:#245a2a;
      --danger:#b42318;
      --shadow:0 14px 34px rgba(32,24,16,.12);
      --r:18px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}

    body{
      margin:0;
      font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background:var(--bg);
      color:var(--ink);
    }

    header{
      position:sticky;
      top:0;
      z-index:20;
      background:var(--brand);
      color:#fff;
      padding:12px;
      box-shadow:0 10px 24px rgba(0,0,0,.18);
    }

    .head{
      max-width:1200px;
      margin:0 auto;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
    }

    .title{
      min-width:0;
    }
    .title h1{
      margin:0;
      font-size:18px;
      line-height:1.1;
    }
    .title .sub{
      margin-top:4px;
      font-size:12px;
      opacity:.9;
    }

    .pill{
      background:rgba(255,255,255,.14);
      border:1px solid rgba(255,255,255,.18);
      border-radius:999px;
      padding:10px 14px;
      font-weight:900;
      white-space:nowrap;
    }

    .wrap{
      max-width:1200px;
      margin:0 auto;
      padding:14px;
      display:grid;
      gap:14px;
    }

    .hero{
      border-radius:22px;
      overflow:hidden;
      box-shadow:var(--shadow);
      border:1px solid var(--line);
      background:#111;
    }
    .hero img{
      width:100%;
      height:150px;
      object-fit:cover;
      display:block;
    }

    .grid{
      display:grid;
      grid-template-columns:1.2fr .9fr;
      gap:14px;
      align-items:start;
    }
    @media (max-width:980px){
      .grid{grid-template-columns:1fr}
    }

    .card{
      background:var(--paper);
      border:1px solid var(--line);
      border-radius:var(--r);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .card h2{
      margin:0;
      padding:14px 16px;
      border-bottom:1px solid var(--line);
      font-size:16px;
      background:rgba(255,255,255,.35);
    }

    .content{padding:14px}

    label{
      display:block;
      font-size:12px;
      font-weight:1000;
      margin:0 0 6px;
      color:var(--muted);
    }

    input, select{
      width:100%;
      padding:14px 12px;
      border:1px solid var(--line);
      border-radius:14px;
      font-size:16px;
      background:#fff;
      color:var(--ink);
      outline:none;
    }

    .topForm{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-bottom:14px;
    }
    @media (max-width:620px){
      .topForm{grid-template-columns:1fr}
    }

    .personas{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:10px;
      margin-bottom:14px;
    }
    @media (max-width:620px){
      .personas{grid-template-columns:repeat(2, 1fr)}
    }

    .personaBtn{
      border:1px solid rgba(185,132,42,.35);
      background:#fff;
      color:var(--ink);
      border-radius:16px;
      padding:16px 10px;
      font-size:18px;
      font-weight:1000;
      cursor:pointer;
      box-shadow:0 8px 20px rgba(0,0,0,.06);
      min-height:70px;
    }
    .personaBtn.active{
      background:var(--gold);
      color:#fff;
      box-shadow:0 0 0 3px rgba(185,132,42,.18);
    }

    .cats{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-bottom:14px;
    }
    .catBtn{
      border:1px solid var(--line);
      background:#fff;
      border-radius:999px;
      padding:11px 14px;
      font-size:14px;
      font-weight:1000;
      cursor:pointer;
    }
    .catBtn.active{
      background:var(--brand);
      color:#fff;
      border-color:var(--brand);
    }

    .items{
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:10px;
    }
    @media (max-width:620px){
      .items{grid-template-columns:1fr}
    }

    .itemBtn{
      border:1px solid var(--line);
      background:#fff;
      border-radius:18px;
      padding:16px 14px;
      text-align:left;
      cursor:pointer;
      min-height:84px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:4px;
      box-shadow:0 8px 22px rgba(0,0,0,.05);
    }
    .itemBtn .name{
      font-size:20px;
      font-weight:1000;
      line-height:1.1;
    }
    .itemBtn .desc{
      font-size:13px;
      color:var(--muted);
      font-weight:800;
      line-height:1.2;
    }

    .miniNote{
      margin-top:12px;
      padding:10px 12px;
      border-radius:12px;
      background:rgba(255,255,255,.45);
      border:1px solid var(--line);
      color:var(--muted);
      font-size:12px;
      font-weight:800;
    }

    .group{
      margin-bottom:12px;
      border:1px solid var(--line);
      border-radius:16px;
      overflow:hidden;
      background:#fffdf9;
    }
    .groupHead{
      padding:10px 12px;
      background:rgba(185,132,42,.12);
      border-bottom:1px solid var(--line);
      font-weight:1000;
      font-size:15px;
    }

    .line{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:flex-start;
      padding:12px;
      border-bottom:1px dashed var(--line);
    }
    .line:last-child{border-bottom:none}

    .lineName{
      font-weight:1000;
      font-size:15px;
      line-height:1.2;
    }
    .lineNote{
      margin-top:4px;
      color:var(--muted);
      font-size:12px;
      font-weight:900;
      line-height:1.25;
      white-space:pre-wrap;
    }

    .rightBtns{
      display:flex;
      flex-direction:column;
      gap:6px;
      align-items:stretch;
      min-width:92px;
    }

    .mini, .btn, .btnDark, .btnDanger{
      border:none;
      border-radius:12px;
      cursor:pointer;
      font-weight:1000;
    }

    .mini{
      height:36px;
      background:#fff;
      border:1px solid var(--line);
      color:var(--ink);
      font-size:18px;
    }

    .btnRow{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:12px;
    }

    .btn{
      background:var(--gold);
      color:#fff;
      padding:14px 16px;
      font-size:15px;
      border-radius:14px;
      box-shadow:0 10px 24px rgba(185,132,42,.22);
    }
    .btnDark{
      background:var(--brand);
      color:#fff;
      padding:14px 16px;
      font-size:15px;
      border-radius:14px;
    }
    .btnDanger{
      background:var(--danger);
      color:#fff;
      padding:14px 16px;
      font-size:15px;
      border-radius:14px;
    }

    .empty{
      color:var(--muted);
      font-weight:1000;
      padding:8px 0;
    }

    .backdrop{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.55);
      display:none;
      align-items:center;
      justify-content:center;
      padding:16px;
      z-index:50;
    }

    .modal{
      width:min(520px, 100%);
      background:var(--paper);
      border-radius:18px;
      box-shadow:0 30px 80px rgba(0,0,0,.32);
      border:1px solid var(--line);
      overflow:hidden;
    }

    .modalHead{
      padding:14px 16px;
      border-bottom:1px solid var(--line);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      background:#fff;
    }
    .modalHead h3{
      margin:0;
      font-size:17px;
    }

    .closeX{
      width:40px;
      height:40px;
      border-radius:12px;
      border:1px solid var(--line);
      background:#fff;
      font-size:18px;
      font-weight:1000;
      cursor:pointer;
    }

    .modalBody{
      padding:14px;
      display:grid;
      gap:10px;
    }

    .modalFoot{
      padding:14px;
      border-top:1px solid var(--line);
      display:flex;
      gap:10px;
      background:rgba(255,255,255,.4);
    }
    .modalFoot button{flex:1}

    .print-area{display:none}

    @media print{
      body *{visibility:hidden !important}
      .print-area, .print-area *{visibility:visible !important}
      .print-area{
        display:block !important;
        position:absolute;
        inset:0;
        background:#fff;
        color:#000;
      }
      @page{
        size:80mm auto;
        margin:2mm;
      }
    }

    .ticket{
      width:76mm;
      margin:0 auto;
      padding:3mm 2mm;
      font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
      color:#000;
      background:#fff;
      font-size:12px;
      line-height:1.25;
    }
    .ticket .c{text-align:center}
    .ticket .b{font-weight:900}
    .ticket .lg{font-size:18px}
    .ticket .hr{
      border-top:1px dashed #000;
      margin:6px 0;
    }
    .ticket .g{
      margin:8px 0 4px;
      font-weight:900;
      font-size:13px;
      text-transform:uppercase;
    }
    .ticket .it{
      margin:6px 0;
    }
    .ticket .itn{
      font-weight:900;
      font-size:15px;
      line-height:1.15;
    }
    .ticket .sub{
      padding-left:8px;
      font-size:11px;
      white-space:pre-wrap;
    }
  </style>
</head>
<body>
<header>
  <div class="head">
    <div class="title">
      <h1>🍽️ Comandas Cocina</h1>
      <div class="sub">Simple para mesero • limpio para cocina</div>
    </div>
    <div class="pill" id="pill">0 productos</div>
  </div>
</header>

<div class="wrap">
  <div class="hero">
    <img src="portadagdp.png" alt="Taquería Guadalupe Victoria">
  </div>

  <div class="grid">
    <!-- IZQUIERDA -->
    <section class="card">
      <h2>Tomar pedido</h2>
      <div class="content">
        <div class="topForm">
          <div>
            <label>Mesa</label>
            <select id="mesa"></select>
          </div>
          <div>
            <label>Mesero</label>
            <input id="mesero" placeholder="Ej. Marco">
          </div>
        </div>

        <label>¿Para quién es?</label>
        <div class="personas" id="personas"></div>

        <div class="cats" id="cats"></div>

        <div class="items" id="items"></div>

        <div class="miniNote">
          Toca una persona y luego toca los productos. Así queda claro qué va en cada plato.
        </div>
      </div>
    </section>

    <!-- DERECHA -->
    <aside class="card">
      <h2>Comanda actual</h2>
      <div class="content">
        <div id="cart"></div>

        <div class="btnRow">
          <button class="btnDanger" id="btnVaciar">Vaciar</button>
          <button class="btnDark" id="btnImprimir">Imprimir cocina</button>
        </div>

        <div class="miniNote">
          El ticket sale por persona y sin precios.
        </div>
      </div>
    </aside>
  </div>
</div>

<!-- MODAL NOTA -->
<div class="backdrop" id="backdrop">
  <div class="modal">
    <div class="modalHead">
      <h3 id="modalTitle">Agregar detalle</h3>
      <button class="closeX" id="btnCerrarModal" type="button">✕</button>
    </div>
    <div class="modalBody">
      <div>
        <label id="modalPersonaLabel">Persona</label>
        <input id="notaRapida" placeholder="Ej. sin cebolla / bien dorado / combinado">
      </div>
    </div>
    <div class="modalFoot">
      <button class="btnDanger" id="btnCancelarModal" type="button">Cancelar</button>
      <button class="btnDark" id="btnGuardarModal" type="button">Agregar</button>
    </div>
  </div>
</div>

<div class="print-area" id="printArea"></div>

<script>
const catalogo = [
  {id:"taco_tripa",    cat:"TACOS",        name:"Taco de Tripa",    desc:"Tripa doradita", requiereNota:false},
  {id:"taco_pastor",   cat:"TACOS",        name:"Taco de Pastor",   desc:"", requiereNota:false},
  {id:"taco_bistec",   cat:"TACOS",        name:"Taco de Bistec",   desc:"", requiereNota:false},
  {id:"taco_chorizo",  cat:"TACOS",        name:"Taco de Chorizo",  desc:"", requiereNota:false},
  {id:"taco_alambre",  cat:"TACOS",        name:"Taco de Alambre",  desc:"", requiereNota:false},
  {id:"taco_costilla", cat:"TACOS",        name:"Taco de Costilla", desc:"", requiereNota:false},
  {id:"taco_barbacoa", cat:"TACOS",        name:"Taco de Barbacoa", desc:"", requiereNota:false},
  {id:"taco_higado",   cat:"TACOS",        name:"Taco de Hígado",   desc:"", requiereNota:false},
  {id:"taco_combi",    cat:"TACOS",        name:"Taco Combinado",   desc:"Escribe combinación", requiereNota:true},

  {id:"quesa_tripa",   cat:"QUESADILLAS",  name:"Quesadilla de Tripa",   desc:"", requiereNota:false},
  {id:"quesa_pastor",  cat:"QUESADILLAS",  name:"Quesadilla de Pastor",  desc:"", requiereNota:false},
  {id:"quesa_bistec",  cat:"QUESADILLAS",  name:"Quesadilla de Bistec",  desc:"", requiereNota:false},
  {id:"quesa_chorizo", cat:"QUESADILLAS",  name:"Quesadilla de Chorizo", desc:"", requiereNota:false},
  {id:"quesa_higado",  cat:"QUESADILLAS",  name:"Quesadilla de Hígado",  desc:"", requiereNota:false},

  {id:"charola_combi", cat:"CHAROLAS",     name:"Charola Combinada", desc:"Escribe combinación", requiereNota:true},
  {id:"charola_alam",  cat:"CHAROLAS",     name:"Charola de Alambre", desc:"", requiereNota:false},

  {id:"volcan_tripa",   cat:"VOLCANES",    name:"Volcán de Tripa",   desc:"", requiereNota:false},
  {id:"volcan_pastor",  cat:"VOLCANES",    name:"Volcán de Pastor",  desc:"", requiereNota:false},
  {id:"volcan_bistec",  cat:"VOLCANES",    name:"Volcán de Bistec",  desc:"", requiereNota:false},
  {id:"volcan_chorizo", cat:"VOLCANES",    name:"Volcán de Chorizo", desc:"", requiereNota:false},
  {id:"volcan_higado",  cat:"VOLCANES",    name:"Volcán de Hígado",  desc:"", requiereNota:false},

  {id:"beb_coca_light",  cat:"BEBIDAS",    name:"Coca Light",       desc:"", requiereNota:false},
  {id:"beb_coca",        cat:"BEBIDAS",    name:"Coca",             desc:"", requiereNota:false},
  {id:"beb_fresca",      cat:"BEBIDAS",    name:"Fresca",           desc:"", requiereNota:false},
  {id:"beb_sprite",      cat:"BEBIDAS",    name:"Sprite",           desc:"", requiereNota:false},
  {id:"beb_agua",        cat:"BEBIDAS",    name:"Agua fresca",      desc:"", requiereNota:false},
  {id:"beb_agua_lt",     cat:"BEBIDAS",    name:"Agua fresca 1 Lt", desc:"", requiereNota:false},

  {id:"pos_pay",         cat:"POSTRES",    name:"Pay de queso",                   desc:"", requiereNota:false},
  {id:"pos_rompope",     cat:"POSTRES",    name:"Gelatina vainilla con rompope", desc:"", requiereNota:false},
  {id:"pos_arroz",       cat:"POSTRES",    name:"Arroz con leche",               desc:"", requiereNota:false},
  {id:"pos_flan",        cat:"POSTRES",    name:"Flan",                          desc:"", requiereNota:false},
  {id:"pos_fresa",       cat:"POSTRES",    name:"Gelatina fresa con yoghurt",    desc:"", requiereNota:false},
  {id:"pos_napolitano",  cat:"POSTRES",    name:"Napolitano",                    desc:"", requiereNota:false},
];

const CATS = ["TACOS","QUESADILLAS","CHAROLAS","VOLCANES","BEBIDAS","POSTRES"];
const PERSONAS = ["Persona 1","Persona 2","Persona 3","Persona 4","Persona 5","General"];

const mesa = document.getElementById("mesa");
const mesero = document.getElementById("mesero");
const personasBox = document.getElementById("personas");
const catsBox = document.getElementById("cats");
const itemsBox = document.getElementById("items");
const cartBox = document.getElementById("cart");
const pill = document.getElementById("pill");

const backdrop = document.getElementById("backdrop");
const modalTitle = document.getElementById("modalTitle");
const modalPersonaLabel = document.getElementById("modalPersonaLabel");
const notaRapida = document.getElementById("notaRapida");
const btnCerrarModal = document.getElementById("btnCerrarModal");
const btnCancelarModal = document.getElementById("btnCancelarModal");
const btnGuardarModal = document.getElementById("btnGuardarModal");

let activeCat = "TACOS";
let personaActiva = "Persona 1";
let cart = [];
let draftItem = null;

for(let i=1;i<=20;i++){
  const op = document.createElement("option");
  op.value = "Mesa " + i;
  op.textContent = "Mesa " + i;
  mesa.appendChild(op);
}

function escapeHtml(s){
  return String(s || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");
}

function totalProductos(){
  return cart.reduce((a,x)=>a + x.qty, 0);
}

function makeKey(item, persona, note){
  return [item.id, persona, note || ""].join("|");
}

function renderPersonas(){
  personasBox.innerHTML = "";
  PERSONAS.forEach(p=>{
    const b = document.createElement("button");
    b.type = "button";
    b.className = "personaBtn" + (p === personaActiva ? " active" : "");
    b.textContent = p;
    b.addEventListener("click", ()=>{
      personaActiva = p;
      renderPersonas();
    });
    personasBox.appendChild(b);
  });
}

function renderCats(){
  catsBox.innerHTML = "";
  CATS.forEach(c=>{
    const b = document.createElement("button");
    b.type = "button";
    b.className = "catBtn" + (c === activeCat ? " active" : "");
    b.textContent = c;
    b.addEventListener("click", ()=>{
      activeCat = c;
      renderCats();
      renderItems();
    });
    catsBox.appendChild(b);
  });
}

function renderItems(){
  itemsBox.innerHTML = "";
  const list = catalogo.filter(x => x.cat === activeCat);

  list.forEach(item=>{
    const b = document.createElement("button");
    b.type = "button";
    b.className = "itemBtn";
    b.innerHTML = `
      <div class="name">${escapeHtml(item.name)}</div>
      <div class="desc">${escapeHtml(item.desc || "")}</div>
    `;
    b.addEventListener("click", ()=> agregarDesdeClick(item));
    itemsBox.appendChild(b);
  });
}

function agregarDesdeClick(item){
  if(item.requiereNota){
    abrirModal(item);
    return;
  }
  agregarLinea(item, personaActiva, "");
}

function agregarLinea(item, persona, note){
  const key = makeKey(item, persona, note);
  const existing = cart.find(x=>x.key === key);

  if(existing){
    existing.qty += 1;
  }else{
    cart.push({
      key,
      id:item.id,
      name:item.name,
      persona,
      note:note || "",
      qty:1
    });
  }

  renderCart();
}

function agruparCart(){
  const grupos = {};
  cart.forEach(line=>{
    if(!grupos[line.persona]) grupos[line.persona] = [];
    grupos[line.persona].push(line);
  });

  return PERSONAS
    .filter(p => grupos[p] && grupos[p].length)
    .map(p => ({ persona:p, lines:grupos[p] }));
}

function renderCart(){
  pill.textContent = `${totalProductos()} productos`;

  if(!cart.length){
    cartBox.innerHTML = `<div class="empty">Aún no agregas productos.</div>`;
    return;
  }

  cartBox.innerHTML = "";

  const grupos = agruparCart();

  grupos.forEach(group=>{
    const g = document.createElement("div");
    g.className = "group";

    const head = document.createElement("div");
    head.className = "groupHead";
    head.textContent = group.persona;
    g.appendChild(head);

    group.lines.forEach(line=>{
      const idx = cart.indexOf(line);
      const row = document.createElement("div");
      row.className = "line";
      row.innerHTML = `
        <div style="min-width:0">
          <div class="lineName">${escapeHtml(line.name)}</div>
          ${line.note ? `<div class="lineNote">${escapeHtml(line.note)}</div>` : ``}
        </div>
        <div class="rightBtns">
          <button class="mini" type="button" data-a="dec">−</button>
          <button class="mini" type="button" disabled style="font-size:15px;font-weight:1000">${line.qty}</button>
          <button class="mini" type="button" data-a="inc">+</button>
          <button class="mini" type="button" data-a="del">✕</button>
        </div>
      `;

      row.querySelector('[data-a="dec"]').addEventListener("click", ()=>{
        line.qty = Math.max(1, line.qty - 1);
        renderCart();
      });
      row.querySelector('[data-a="inc"]').addEventListener("click", ()=>{
        line.qty += 1;
        renderCart();
      });
      row.querySelector('[data-a="del"]').addEventListener("click", ()=>{
        cart.splice(idx, 1);
        renderCart();
      });

      g.appendChild(row);
    });

    cartBox.appendChild(g);
  });
}

function abrirModal(item){
  draftItem = item;
  modalTitle.textContent = item.name;
  modalPersonaLabel.textContent = `Nota para ${personaActiva}`;
  notaRapida.value = "";
  backdrop.style.display = "flex";
  document.body.style.overflow = "hidden";
  setTimeout(()=>notaRapida.focus(), 50);
}

function cerrarModal(){
  draftItem = null;
  notaRapida.value = "";
  backdrop.style.display = "none";
  document.body.style.overflow = "";
}

btnCerrarModal.addEventListener("click", cerrarModal);
btnCancelarModal.addEventListener("click", cerrarModal);
backdrop.addEventListener("click", (e)=>{
  if(e.target === backdrop) cerrarModal();
});

btnGuardarModal.addEventListener("click", ()=>{
  if(!draftItem) return;
  agregarLinea(draftItem, personaActiva, notaRapida.value.trim());
  cerrarModal();
});

function validarAntesImprimir(){
  if(!mesa.value.trim()) return "Selecciona una mesa.";
  if(!mesero.value.trim()) return "Escribe el nombre del mesero.";
  if(!cart.length) return "Agrega productos a la comanda.";
  return null;
}

function buildTicketHTML(){
  const grupos = agruparCart();

  const gruposHtml = grupos.map(group=>{
    const itemsHtml = group.lines.map(line=>`
      <div class="it">
        <div class="itn">${escapeHtml(line.qty)} x ${escapeHtml(line.name)}</div>
        ${line.note ? `<div class="sub">• ${escapeHtml(line.note)}</div>` : ``}
      </div>
    `).join("");

    return `
      <div class="g">${escapeHtml(group.persona)}</div>
      ${itemsHtml}
      <div class="hr"></div>
    `;
  }).join("");

  return `
    <div class="ticket">
      <div class="c b lg">COMANDA</div>
      <div class="c b">${escapeHtml(mesa.value)}</div>
      <div class="hr"></div>
      ${gruposHtml}
    </div>
  `;
}

function imprimir(){
  const err = validarAntesImprimir();
  if(err){
    alert(err);
    return;
  }
  const area = document.getElementById("printArea");
  area.innerHTML = buildTicketHTML();
  setTimeout(()=>window.print(), 120);
}

document.getElementById("btnVaciar").addEventListener("click", ()=>{
  if(confirm("¿Vaciar la comanda?")){
    cart = [];
    renderCart();
  }
});

document.getElementById("btnImprimir").addEventListener("click", imprimir);

renderPersonas();
renderCats();
renderItems();
renderCart();
</script>
